ate(1.15);z-index:-3}
.glow{position:fixed;width:280px;height:280px;border-radius:50%;background:#005eff;filter:blur(100px);opacity:.18;z-index:-2;animation:float 8s infinite alternate ease-in-out}
.g1{top:-80px;left:-70px}.g2{right:-100px;bottom:-80px;animation-delay:2s}
@keyframes float{to{transform:translate(70px,40px) scale(1.2)}}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(430px,100%);background:rgba(3,8,20,.78);border:1px solid rgba(0,115,255,.55);box-shadow:0 0 35px rgba(0,70,255,.22),inset 0 0 35px rgba(0,50,255,.05);border-radius:24px;padding:25px;backdrop-filter:blur(14px)}
.logo{text-align:center;font-size:34px;font-weight:900;letter-spacing:3px;color:#4ea0ff;text-shadow:0 0 8px #006cff,0 0 24px #006cff;margin:4px 0 7px}
.sub{text-align:center;color:#9ab8e8;font-size:12px;letter-spacing:2px;margin-bottom:24px}
input,select{width:100%;padding:15px;border-radius:13px;border:1px solid #155cff;background:rgba(0,8,25,.85);color:#fff;outline:none;font-size:15px;margin:7px 0}
input:focus,select:focus{box-shadow:0 0 16px rgba(0,105,255,.35)}
button{border:0;color:white;cursor:pointer;font-weight:800;letter-spacing:.7px}
.primary{width:100%;padding:15px;border-radius:13px;background:linear-gradient(90deg,#0055ff,#008cff);box-shadow:0 0 22px rgba(0,91,255,.45);margin-top:10px}
.primary:active,.bigbtn:active{transform:scale(.98)}
.linkbtn{background:none;color:#62a9ff;margin:16px auto 0;display:block;font-size:12px}
.msg{text-align:center;min-height:19px;font-size:12px;margin-top:10px;color:#72b3ff}
.hidden{display:none!important}
.loader{text-align:center}
.spinner{width:74px;height:74px;border-radius:50%;border:4px solid rgba(60,130,255,.15);border-top-color:#1d78ff;border-right-color:#69b0ff;animation:spin 1s linear infinite;margin:0 auto 18px;box-shadow:0 0 25px #006cff}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:12px;border-radius:99px;background:#07142e;overflow:hidden;border:1px solid #1245a3;margin-top:18px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#005eff,#64c8ff);box-shadow:0 0 18px #008cff;transition:width .45s ease}
.percent{text-align:center;margin-top:10px;font-weight:900;color:#66b5ff}
.panel{width:min(920px,100%);padding:8px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
.title{font-size:25px;font-weight:900;color:#65b8ff;text-shadow:0 0 14px #006cff}
.badge{font-size:11px;padding:8px 11px;border-radius:99px;border:1px solid #1768ff;background:rgba(0,80,255,.12);color:#7bc1ff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{padding:16px;border:1px solid rgba(35,110,255,.55);border-radius:17px;background:rgba(3,10,28,.75);box-shadow:inset 0 0 20px rgba(0,70,255,.04)}
.item h3{margin:0 0 5px;font-size:14px}.item small{color:#819ac2}
.switch{float:right;width:45px;height:25px;border-radius:20px;background:#17213a;position:relative;transition:.2s}
.switch:after{content:"";position:absolute;width:19px;height:19px;top:3px;left:3px;border-radius:50%;background:#77849c;transition:.2s}
input[type=checkbox]{display:none}
input[type=checkbox]:checked + .switch{background:#006aff;box-shadow:0 0 16px #006aff}
input[type=checkbox]:checked + .switch:after{left:23px;background:white}
.section{margin:20px 0 10px;color:#9ec4ff;font-size:12px;letter-spacing:2px}
.devices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.device{padding:12px 5px;border:1px solid #123a7d;background:rgba(2,8,23,.72);border-radius:12px;text-align:center;font-size:12px}
.device.active{border-color:#1680ff;box-shadow:0 0 18px rgba(0,105,255,.35);background:rgba(0,76,255,.15)}
.bigbtn{width:100%;padding:19px;border-radius:16px;background:linear-gradient(90deg,#004eff,#00a2ff);font-size:17px;box-shadow:0 0 30px rgba(0,112,255,.5);margin-top:16px}
.adminbox{margin-top:18px;padding-top:18px;border-top:1px solid rgba(40,100,220,.3)}
.keyrow{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid #123a7d;border-radius:10px;margin-top:8px;background:rgba(0,5,20,.55);font-size:11px}
.keyrow code{color:#7fc1ff;flex:1;overflow:hidden;text-overflow:ellipsis}
.danger{background:#4a1020;border:1px solid #a52650;padding:7px 9px;border-radius:8px;font-size:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:rgba(4,12,30,.95);border:1px solid #1678ff;padding:12px 16px;border-radius:12px;box-shadow:0 0 20px rgba(0,100,255,.35);transition:.25s;z-index:20;font-size:12px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.grid{grid-template-columns:1fr}.devices{grid-template-columns:repeat(2,1fr)}.card{padding:20px}.title{font-size:21px}}
</style>

    <input id="adminPass" type="password" placeholder="Senha administrativa">
    <button class="primary" onclick="adminAuth()">ENTRAR</button>
    <div id="adminMsg" class="msg"></div>
    <button class="linkbtn" onclick="backLogin()">VOLTAR</button>
  </div>
</section>

<section id="admin" class="screen hidden">
  <div class="panel">
    <div class="top"><div class="title">ADMINISTRADOR</div><div class="badge">GERENCIADOR DE KEYS</div></div>
    <div class="card" style="max-width:none">
      <div class="section">GERAR NOVA KEY</div>
      <select id="duration"><option value="1">1 DIA</option><option value="7">1 SEMANA</option><option value="30">1 MÊS</option><option value="0">PERMANENTE</option></select>
      <button class="primary" onclick="generateKey()">GERAR KEY</button>
      <div id="newKey" class="msg"></div>
      <div class="section">KEYS GERADAS</div>
      <div id="keyList"></div>
      <button class="linkbtn" onclick="logoutAdmin()">SAIR DA ADMINISTRAÇÃO</button>
    </div>
  </div>
</section>

<section id="main" class="screen hidden">
  <div class="panel">
    <div class="top"><div><div class="title">BEM-VINDO</div><small style="color:#83a9df">SUESA7 ☠ • PAINEL</small></div><div class="badge" id="deviceBadge">NÃO SELECIONADO</div></div>
    <div class="grid">
      <div class="item"><label><h3>HS BRUTAL</h3><small>Configuração visual</small><input type="checkbox" id="hs"><span class="switch"></span></label></div>
      <div class="item"><label><h3>PUXADA RÁPIDA</h3><small>Perfil de toque</small><input type="checkbox" id="pull"><span class="switch"></span></label></div>
      <div class="item"><label><h3>OTIMIZAR TOUCH</h3><small>Resposta da interface</small><input type="checkbox" id="touch"><span class="switch"></span></label></div>
      <div class="item"><label><h3>REDUZIR RECOIL</h3><small>Perfil de treino</small><input type="checkbox" id="recoil"><span class="switch"></span></label></div>
      <div class="item"><label><h3>144 FPS</h3><small>Meta de desempenho</small><input type="checkbox" id="fps144"><span class="switch"></span></label></div>
      <div class="item"><label><h3>120 FPS</h3><small>Meta de desempenho</small><input type="checkbox" id="fps120"><span class="switch"></span></label></div>
    </div>
    <div class="section">SELECIONE SEU DISPOSITIVO</div>
    <div class="devices">
      <button class="device" onclick="selectDevice(this,'Motorola')">Motorola</button>
      <button class="device" onclick="selectDevice(this,'Samsung')">Samsung</button>
      <button class="device" onclick="selectDevice(this,'Xiaomi')">Xiaomi</button>
      <button class="device" onclick="selectDevice(this,'iOS')">iOS</button>
    </div>
    <button class="bigbtn" onclick="openFreeFire()">▶ ABRIR FREE FIRE</button>
  </div>
</section>

<div id="toast" class="toast"></div>

<script>
const ADMIN_PASSWORD="Suesahard7";
const DB_KEY="suesa7_keys_v1";
let adminOK=false;

function $(id){return document.getElementById(id)}
function toast(t){let x=$("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}
function getKeys(){try{return JSON.parse(localStorage.getItem(DB_KEY)||"[]")}catch(e){return[]}}
function saveKeys(a){localStorage.setItem(DB_KEY,JSON.stringify(a))}
function makeKey(){return "SUESA7-"+cryptoRandom(4)+"-"+cryptoRandom(4)+"-"+cryptoRandom(4)}
function cryptoRandom(n){let s="",c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function validKey(k){
  const now=Date.now(), a=getKeys();
  const x=a.find(v=>v.key===k && !v.revoked);
  if(!x)return false;
  if(x.expires && now>x.expires)return false;
  return true;
}
function loginKey(){
  const k=$("keyInput").value.trim().toUpperCase();
  if(validKey(k)){ $("loginMsg").textContent="ACESSO AUTORIZADO"; $("loginMsg").style.color="#69ffb1"; setTimeout(()=>{hideAll();$("main").classList.remove("hidden")},450)}
  else {$("loginMsg").textContent="KEY INVÁLIDA OU EXPIRADA";$("loginMsg").style.color="#ff648e"}
}
function showAdmin(){hideAll();$("adminLogin").classList.remove("hidden")}
function backLogin(){hideAll();$("login").classList.remove("hidden")}
function adminAuth(){
  if($("adminPass").value===ADMIN_PASSWORD){adminOK=true;hideAll();$("admin").classList.remove("hidden");renderKeys()}
  else {$("adminMsg").textContent="SENHA INCORRETA";$("adminMsg").style.color="#ff648e"}
}
function generateKey(){
  if(!adminOK)return;
  const days=Number($("duration").value), now=Date.now();
  const x={key:makeKey(),created:now,expires:days?now+days*86400000:0,revoked:false};
  const a=getKeys();a.push(x);saveKeys(a);
  $("newKey").textContent=x.key;$("newKey").style.color="#69ffb1";renderKeys();toast("KEY GERADA")
}
function renderKeys(){
  const a=getKeys();$("keyList").innerHTML="";
  if(!a.length){$("keyList").innerHTML='<div class="msg">Nenhuma key gerada.</div>';return}
  a.slice().reverse().forEach((x)=>{
    const d=x.expires?new Date(x.expires).toLocaleString("pt-BR"):"PERMANENTE";
    const row=document.createElement("div");row.className="keyrow";
    row.innerHTML="<code>"+x.key+"<br><span style='color:#718ab5'>Expira: "+d+(x.revoked?" • REVOGADA":"")+"</span></code>"+
      "<button class='danger' onclick='revokeKey(\""+x.key+"\")'>REVOGAR</button>";
    $("keyList").appendChild(row);
  });
}
function revokeKey(k){let a=getKeys();let x=a.find(v=>v.key===k);if(x){x.revoked=true;saveKeys(a);renderKeys();toast("KEY REVOGADA")}}
function logoutAdmin(){adminOK=false;$("adminPass").value="";backLogin()}
function selectDevice(btn,name){document.querySelectorAll(".device").forEach(x=>x.classList.remove("active"));btn.classList.add("active");$("deviceBadge").textContent=name;toast(name+" selecionado")}
function openFreeFire(){
  toast("Tentando abrir o Free Fire...");
  // Deep link comum no Android; se o sistema bloquear, o navegador permanece no painel.
  const t=setTimeout(()=>toast("Se não abriu automaticamente, abra o Free Fire manualmente."),1200);
  window.location.href="intent://#Intent;scheme=freefire;package=com.dts.freefireth;end";
}
function hideAll(){["loading","login","adminLogin","admin","main"].forEach(x=>$(x).classList.add("hidden"))}

let p=0;
const timer=setInterval(()=>{
  p+=10;$("bar").style.width=p+"%";$("pct").textContent=p+"%";
  if(p>=50){clearInterval(timer);setTimeout(()=>{hideAll();$("login").classList.remove("hidden")},500)}
},450);
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script></body>
</html>
